name: Build Eden Android APK

on:
  push:
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Deinen fertigen Code von Eden herunterladen
        run: |
          git clone --recursive -b Console-Modes https://git.eden-emu.dev/227dano/eden.git eden_src

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: CMake & Ninja installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache glslang-tools

      - name: Android NDK installieren
        run: |
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Eden APK bauen
        working-directory: eden_src/src/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        run: |
          chmod +x gradlew
          ./gradlew assembleMainlineRelease --no-daemon

      - name: Fertige APK zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Eden-AutoController-APK
          path: eden_src/src/android/app/build/outputs/apk/**/*.apk
